l_english:

 #DEFENSIVE/AUX MODULEs -------------------------------------------------
 voidark_hull:0 "HLP Plating"
 sm_voidark_hull_dm:0 "§E$voidark_delta_tier$ $voidark_hull$§!"
 sm_voidark_hull_dm_desc:0 "A reinforcement to the hull of the $xhk_pc_worldark$ that will improve the structural integrity through infusion of enigmatic energies."
 sm_voidark_hull_ae:0 "§B$voidark_alpha_tier$ $voidark_hull$§!"
 sm_voidark_hull_ae_desc:0 "Based on Alpha technology, this hull reinforcement utilises our full understanding of dark energy to provide superior structural integrity to our $xhk_pc_worldark$."
 sm_voidark_hull_pe:0 "§C$voidark_phi_tier$ $voidark_hull$§!"
 sm_voidark_hull_pe_desc:0 "The technological insights gained from the prototype technologies of the Phi classification further provides benefits to our hull structures."
 sm_voidark_hull_re:0 "§R$voidark_phanon_tier$ $voidark_hull$§!"
 sm_voidark_hull_re_desc:0 "With the full understanding of Runic technologies, our $xhk_pc_worldark$ can be reinforced to be just as durable as Phanon's capital ships."
 sm_voidark_hull_se:0 "§H$voidark_stellarite_tier$ $voidark_hull$§!"
 sm_voidark_hull_se_desc:0 "The shining stellarite energies woven into the hull of the $xhk_pc_worldark$ have rewritten our understanding of what durability is."

 voidark_hull_aux:0 "Reactive Countermeasures"
 sm_voidark_hull_aux_dm:0 "§E$voidark_delta_tier$ $voidark_hull_aux$§!"
 sm_voidark_hull_aux_dm_desc:0 "Swarms of repair drones can be released whenever our hull has sustained any damage. Additionally, whenever they are not actively repairing, these drones act as a structural reinforcement to our ship's hull."
 sm_voidark_hull_aux_ae:0 "§B$voidark_alpha_tier$ $voidark_hull_aux$§!"
 sm_voidark_hull_aux_ae_desc:0 "$sm_voidark_hull_aux_dm_desc$"
 sm_voidark_hull_aux_pe:0 "§C$voidark_phi_tier$ $voidark_hull_aux$§!"
 sm_voidark_hull_aux_pe_desc:0 "$sm_voidark_hull_aux_dm_desc$"
 sm_voidark_hull_aux_re:0 "§R$voidark_phanon_tier$ $voidark_hull_aux$§!"
 sm_voidark_hull_aux_re_desc:0 "$sm_voidark_hull_aux_dm_desc$"
 sm_voidark_hull_aux_se:0 "§H$voidark_stellarite_tier$ $voidark_hull_aux$§!"
 sm_voidark_hull_aux_se_desc:0 "$sm_voidark_hull_aux_dm_desc$"

 voidark_armor:0 "Kinetic Barriers"
 sm_voidark_armor_dm:0 "§E$voidark_delta_tier$ $voidark_armor$§!"
 sm_voidark_armor_dm_desc:0 "Overlaying plates of hard-light armor act as a kinetic defense for our $xhk_pc_worldark$. It shall be protected against any physical ammunition."
 sm_voidark_armor_ae:0 "§B$voidark_alpha_tier$ $voidark_armor$§!"
 sm_voidark_armor_ae_desc:0 "With our newfound insights, we have improved the defensive capacity of our armor plates, allowing our $xhk_pc_worldark$ to stay ever vigilant in the face of the enemy."
 sm_voidark_armor_pe:0 "§C$voidark_phi_tier$ $voidark_armor$§!"
 sm_voidark_armor_pe_desc:0 "While not rivaling the capabilities of Phanon's armor platings just yet, this prototype design is an improvement to any previous materials we ever thought possible."
 sm_voidark_armor_re:0 "§R$voidark_phanon_tier$ $voidark_armor$§!"
 sm_voidark_armor_re_desc:0 "It has to be said that Phanon employed excellent designs when creating their defensive components. Finally, we can now make use of their ingenuity to better defend our home."
 sm_voidark_armor_se:0 "§H$voidark_stellarite_tier$ $voidark_armor$§!"
 sm_voidark_armor_se_desc:0 "Never would we have imagined the power that Stellarite energy would bring. Our $xhk_pc_worldark$ shall be a shining beacon of resiliance in the face of any adversary."

 voidark_armor_aux:0 "Kinetic Defensive Enhancement"
 sm_voidark_armor_aux_dm:0 "§E$voidark_delta_tier$ $voidark_armor_aux$§!"
 sm_voidark_armor_aux_dm_desc:0 "By weaving dark matter into the connective parts of our armor plates, we further strengthen their structural capabilities."
 sm_voidark_armor_aux_ae:0 "§B$voidark_alpha_tier$ $voidark_armor_aux$§!"
 sm_voidark_armor_aux_ae_desc:0 "With the technological advancements brought about by Alpha tier technologies, we were able to further enhance the capabilities of our kinetic defenses. Even Delta designs pale in comparison."
 sm_voidark_armor_aux_pe:0 "§C$voidark_phi_tier$ $voidark_armor_aux$§!"
 sm_voidark_armor_aux_pe_desc:0 "A kinetic enhancement based on the glimpses we got of Phanon's technologies. Its precise workings are not entirely clear to us."
 sm_voidark_armor_aux_re:0 "§R$voidark_phanon_tier$ $voidark_armor_aux$§!"
 sm_voidark_armor_aux_re_desc:0 "Finally, the real deal. Phanon's defensive enhancements are even stronger than the prior Phi technologies would have made us believe!"
 sm_voidark_armor_aux_se:0 "§H$voidark_stellarite_tier$ $voidark_armor_aux$§!"
 sm_voidark_armor_aux_se_desc:0 "Through the high density of stellarite energy, we are able to fortify our $xhk_pc_worldark$ to be an everlasting bastion in the face of any adversary."

 voidark_shield:0 "Shields"
 sm_voidark_shield_dm:0 "§E$voidark_delta_tier$ $voidark_shield$§!"
 sm_voidark_shield_dm_desc:0 "Enigmatic shields absorb any energy based attacks thrown at our arkship, proving the potential of dark energy."
 sm_voidark_shield_ae:0 "§B$voidark_alpha_tier$ $voidark_shield$§!"
 sm_voidark_shield_ae_desc:0 "Never has a power in this galaxy seen shields as capable as these. With the Alpha designs, the former rulers of this galaxy will find our defenses to be an impenetrable barrier."
 sm_voidark_shield_pe:0 "§C$voidark_phi_tier$ $voidark_shield$§!"
 sm_voidark_shield_pe_desc:0 "While not rivaling the capabilities of Phanon's shields just yet, this prototype design is an improvement to even the Alpha designs. One shivers imagining what power the real Phanon technologies would bring."
 sm_voidark_shield_re:0 "§R$voidark_phanon_tier$ $voidark_shield$§!"
 sm_voidark_shield_re_desc:0 "It has to be said that Phanon employed excellent designs when creating their defensive components. Finally, we can now make use of their ingenuity to better defend our home."
 sm_voidark_shield_se:0 "§H$voidark_stellarite_tier$ $voidark_shield$§!"
 sm_voidark_shield_se_desc:0 "Never would we have imagined the power that Stellarite energy would bring. Our $xhk_pc_worldark$ shall be a shining beacon of resiliance in the face of any adversary."

 voidark_shield_aux:0 "Shield Supercharger"
 sm_voidark_shield_aux_dm:0 "§E$voidark_delta_tier$ $voidark_shield_aux$§!"
 sm_voidark_shield_aux_dm_desc:0 "By infusing dark energy into the projectors of our shields we are able to boost their capabilities even further."
 sm_voidark_shield_aux_ae:0 "§B$voidark_alpha_tier$ $voidark_shield_aux$§!"
 sm_voidark_shield_aux_ae_desc:0 "After thorough redesign of our shield emitters, we have managed to create a module which allows for overcharging of the shield's energetic lattice. While more costly in terms of dark energy, this increase in defensive capacity more than makes up for it."
 sm_voidark_shield_aux_pe:0 "§C$voidark_phi_tier$ $voidark_shield_aux$§!"
 sm_voidark_shield_aux_pe_desc:0 "While our investigations in the potential of the technologies we obtained from Phanon is still being investigated, it nevertheless appears to improve our existing designs. With this prototype shield supercharger, we are able to strengthen our shields even further."
 sm_voidark_shield_aux_re:0 "§R$voidark_phanon_tier$ $voidark_shield_aux$§!"
 sm_voidark_shield_aux_re_desc:0 "Runic energy pulses rapidly into the lattice of our shields, wrapping around any structural component and strengthening it vastly! Our shields shall become impenetrable!"
 sm_voidark_shield_aux_se:0 "§H$voidark_stellarite_tier$ $voidark_shield_aux$§!"
 sm_voidark_shield_aux_se_desc:0 "The shields of our arkship will glow as bright and strong as the very stars! No energy weapon shall be of any harm to our home anymore."

 voidark_afterburner:0 "$AFTERBURNER_1$"
 sm_voidark_afterburner_dm:0 "§E$voidark_delta_tier$ $voidark_afterburner$§!"
 sm_voidark_afterburner_dm_desc:0 "By leaking trace amounts of dark energy directly into the output of our thrusters, we are able to create an explosive acceleration that rapidly boosts our ship's speed when required."
 sm_voidark_afterburner_ae:0 "§B$voidark_alpha_tier$ $voidark_afterburner$§!"
 sm_voidark_afterburner_ae_desc:0 "Building on the design of the previous generation, the alpha tier afterburners utilize a more efficient propulsion system with pin-point injection of dark energy."
 sm_voidark_afterburner_pe:0 "§C$voidark_phi_tier$ $voidark_afterburner$§!"
 sm_voidark_afterburner_pe_desc:0 "Structurally, the design of these afterburners do not differ much from our previous iterations. Yet, somehow, they are able to provide more thrust at a more efficient fuel-to-thrust ratio."
 sm_voidark_afterburner_re:0 "§R$voidark_phanon_tier$ $voidark_afterburner$§!"
 sm_voidark_afterburner_re_desc:0 "With the proper technologies of Phanon now in our hands, we were able to discover that through trace amounts of runic energy in the material of the propellant injectors, the accelerators output gets increased even further."
 sm_voidark_afterburner_se:0 "§H$voidark_stellarite_tier$ $voidark_afterburner$§!"
 sm_voidark_afterburner_se_desc:0 "To quote the crew of one of our $waystation_plural$: They flew by so fast, we only saw a brief flash of light as they passed us."

 voidark_starcharter:0 "Starcharter"
 sm_voidark_starcharter_dm:0 "§E$voidark_delta_tier$ $voidark_starcharter$§!"
 sm_voidark_starcharter_dm_desc:0 "This module equips our $xhk_pc_worldark$ with state-of-the-art sensor arrays. Their data supports and enhances the tracking and guidance systems of our weapon modules."
 sm_voidark_starcharter_ae:0 "§B$voidark_alpha_tier$ $voidark_starcharter$§!"
 sm_voidark_starcharter_ae_desc:0 "An even further enhanced version of the Starcharter arrays, the accuracy of our weapon has improved significantly."
 sm_voidark_starcharter_pe:0 "§C$voidark_phi_tier$ $voidark_starcharter$§!"
 sm_voidark_starcharter_pe_desc:0 "Even though Phi technologies are clearly not as impressive as what the Phanon Corps utilises themselves, it is nevertheless unbelievable how effortless targeting becomes with this module installed."
 sm_voidark_starcharter_re:0 "§R$voidark_phanon_tier$ $voidark_starcharter$§!"
 sm_voidark_starcharter_re_desc:0 "We were correct in assuming the superiority of the real Phanon technologies. With predictive algorithms that have a success rate of over 98%, it is no longer a mystery how easily the Corps managed to shoot down our vessels."
 sm_voidark_starcharter_se:0 "§H$voidark_stellarite_tier$ $voidark_starcharter$§!"
 sm_voidark_starcharter_se_desc:0 "It was thought impossible to eclipse the potential of Phanon's sensors, yet we were proven wrong. At this point, even the least trained [This.GetSpeciesName] would be able to hit their targets without fail."

 voidark_explosive_core:0 "Enhanced Missile Payload"
 sm_voidark_explosive_core_dm:0 "§E$voidark_delta_tier$ $voidark_explosive_core$§!"
 sm_voidark_explosive_core_dm_desc:0 "Adding dark energy into the missile cores allows for destructive capabilities that rival those of the Fallen Empires."
 sm_voidark_explosive_core_ae:0 "§B$voidark_alpha_tier$ $voidark_explosive_core$§!"
 sm_voidark_explosive_core_ae_desc:0 "This control center oversees the production of our missile payloads. With utmost efficiency, dark energy is used to enhance any missile or torpedo being created."
 sm_voidark_explosive_core_pe:0 "§C$voidark_phi_tier$ $voidark_explosive_core$§!"
 sm_voidark_explosive_core_pe_desc:0 "REPLACE_ME"
 sm_voidark_explosive_core_re:0 "§R$voidark_phanon_tier$ $voidark_explosive_core$§!"
 sm_voidark_explosive_core_re_desc:0 "REPLACE_ME"
 sm_voidark_explosive_core_se:0 "§H$voidark_stellarite_tier$ $voidark_explosive_core$§!"
 sm_voidark_explosive_core_se_desc:0 "REPLACE_ME"

 voidark_kinetic_core:0 "Enhanced Kinetic Payload"
 sm_voidark_kinetic_core_dm:0 "§E$voidark_delta_tier$ $voidark_kinetic_core$§!"
 sm_voidark_kinetic_core_dm_desc:0 "Dedicated assembly bays for our kinetic ammunition. Dark energy is fused with the propellant charges before being transferred to our weapon bays."
 sm_voidark_kinetic_core_ae:0 "§B$voidark_alpha_tier$ $voidark_kinetic_core$§!"
 sm_voidark_kinetic_core_ae_desc:0 "A technological breakthrough allowed us to utilise dark energy to lighten the weight of the ammunition, allowing our weapons to expel them at higher velocities."
 sm_voidark_kinetic_core_pe:0 "§C$voidark_phi_tier$ $voidark_kinetic_core$§!"
 sm_voidark_kinetic_core_pe_desc:0 "We are not entirely certain how Phanon managed to make ammunition so small yet so deadly. What we do know, however, is that we shall employ it leisurely."
 sm_voidark_kinetic_core_re:0 "§R$voidark_phanon_tier$ $voidark_kinetic_core$§!"
 sm_voidark_kinetic_core_re_desc:0 "It is clear now that Phanon's designs should by all accounts be impossible. Yet here we are, creating kinetic payloads with a destructive force that rivals that of concentrated stellar ignitions."
 sm_voidark_kinetic_core_se:0 "§H$voidark_stellarite_tier$ $voidark_kinetic_core$§!"
 sm_voidark_kinetic_core_se_desc:0 "And we thought Phanon's technologies would rival the strength of stellar explosions. Now, one shot of our kinetic weapons has as much power as a supernova."

 voidark_energy_core:0 "Enhanced Energy Payload"
 sm_voidark_energy_core_dm:0 "§E$voidark_delta_tier$ $voidark_energy_core$§!"
 sm_voidark_energy_core_dm_desc:0 "REPLACE_ME"
 sm_voidark_energy_core_ae:0 "§B$voidark_alpha_tier$ $voidark_energy_core$§!"
 sm_voidark_energy_core_ae_desc:0 "REPLACE_ME"
 sm_voidark_energy_core_pe:0 "§C$voidark_phi_tier$ $voidark_energy_core$§!"
 sm_voidark_energy_core_pe_desc:0 "REPLACE_ME"
 sm_voidark_energy_core_re:0 "§R$voidark_phanon_tier$ $voidark_energy_core$§!"
 sm_voidark_energy_core_re_desc:0 "REPLACE_ME"
 sm_voidark_energy_core_se:0 "§H$voidark_stellarite_tier$ $voidark_energy_core$§!"
 sm_voidark_energy_core_se_desc:0 "REPLACE_ME"

 voidark_fighter_core:0 "Enhanced Hangar Support"
 sm_voidark_fighter_core_dm:0 "§E$voidark_delta_tier$ $voidark_fighter_core$§!"
 sm_voidark_fighter_core_dm_desc:0 "These support bays allow our strike-craft to deploy more rapidly into engagements, while utilizing our dark matter infused machinery to lighten payloads. This allows our strike-crafts to engage for longer, more effective durations before needing to return to rearm."
 sm_voidark_fighter_core_ae:0 "§B$voidark_alpha_tier$ $voidark_fighter_core$§!"
 sm_voidark_fighter_core_ae_desc:0 "State-of-the-Art catapults and vast halls of dark energy fueled component printers allow our hangar supports to keep our strike-craft up and running at all time."
 sm_voidark_fighter_core_pe:0 "§C$voidark_phi_tier$ $voidark_fighter_core$§!"
 sm_voidark_fighter_core_pe_desc:0 "Prototype support systems for our strike-craft fleet based upon initial prototypes of Phanon technologies."
 sm_voidark_fighter_core_re:0 "§R$voidark_phanon_tier$ $voidark_fighter_core$§!"
 sm_voidark_fighter_core_re_desc:0 "The subtle psionic energies radiating from the red glow of the runic energy being funneled into the creation of more durable and more effective strike-craft is only overshadowed by noise of the machines that create our strike-craft fleet."
 sm_voidark_fighter_core_se:0 "§H$voidark_stellarite_tier$ $voidark_fighter_core$§!"
 sm_voidark_fighter_core_se_desc:0 "One would imagine that utilizing the rather unstable stellarite energies within such small vessels as our strike-craft would be lunacy. And yet, the results of this endeavor speak for themselves."

