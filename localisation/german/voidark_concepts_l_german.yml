  voidark_doc_basics_1: "The §Y$xhk_pc_worldark$§! can be further upgraded to the tiers of ACOT. $NEW_LINE$$NEW_LINE$§YSwap £zone£ ['concept_district_specializations'] to access these features!§!$NEW_LINE$$NEW_LINE$Upgrades require researching a specific technology, and then function like any previous $xhk_pc_worldark$ upgrades:$NEW_LINE$"
  voidark_doc_basics_2: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_delta_core£ ['concept_delta_tier'] §ETier:§! Unlocks delta tier zones for each district, as well as delta tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_delta']"
  voidark_doc_basics_3: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_alpha_core£ ['concept_alpha_tier'] §BTier:§! Unlocks alpha tier zones for each district, as well as alpha tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_alpha']"
  voidark_doc_basics_4: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phi_core£ ['concept_phi_tier'] §CTier:§! Unlocks phi tier worldark upgrade."
  voidark_doc_basics_5: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phanon_core£ ['concept_phanon_tier'] §RTier:§! Unlocks runic tier zones for each district, as well as runic tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_phanon']"
