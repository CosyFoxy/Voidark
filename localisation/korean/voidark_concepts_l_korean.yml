  voidark_doc_basics_title: "1) Voidark"
  voidark_doc_basics_desc: "$voidark_doc_basics_1$$voidark_doc_basics_2$$voidark_doc_basics_3$$voidark_doc_basics_4$$voidark_doc_basics_5$$voidark_doc_basics_6$"
  voidark_doc_basics_1: "The §Y$xhk_pc_worldark$§! can be further upgraded to the tiers of ACOT. $NEW_LINE$$NEW_LINE$§YFirst, upgrade the $xhk_pc_worldark$ to §H$xhk_worldark_tier_12$§!, then to §E$xhk_worldark_tier_13$§!.$NEW_LINE$Swap £zone£ ['concept_district_specializations'] to access the new zones!§!$NEW_LINE$$NEW_LINE$Upgrades require researching a specific technology, and then function like any previous $xhk_pc_worldark$ upgrades:$NEW_LINE$"
  voidark_doc_basics_2: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_delta_core£ $concept_delta_tier$ §ETier:§! Unlocks delta tier zones for each district, as well as delta tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_delta', $tech_voidark_delta$]"
  voidark_doc_basics_3: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_alpha_core£ $concept_alpha_tier$ §BTier:§! Unlocks alpha tier zones for each district, as well as alpha tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_alpha', $tech_voidark_alpha$]"
  voidark_doc_basics_4: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phi_core£ $concept_phi_tier$ §CTier:§! Unlocks phi tier worldark upgrade. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_phi', $tech_voidark_phi$]"
  voidark_doc_basics_5: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phanon_core£ $concept_phanon_tier$ §RTier:§! Unlocks runic tier zones for each district, as well as runic tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_phanon', $tech_voidark_phanon$]"
  voidark_doc_basics_6: "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_stellarite_core£ $concept_stellarite_tier$ §HTier:§! Unlocks sigma tier zones for each district, as well as sigma tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_stellarite', $tech_voidark_stellarite$]"

  voidark_doc_precursor_megas_title: "2) Precursor Integrated Megastructures"
  voidark_doc_precursor_megas_desc: "By researching £physics£ ['technology:tech_voidark_precursor_integrated_megas', $tech_voidark_precursor_integrated_megas$] you can improve the capabilities of your ['concept_integrated_mega', $concept_integrated_mega_plural$].$NEW_LINE$$NEW_LINE$The system makes use of triggered modifiers. To benefit from it, you need to:$NEW_LINE$- Build any §H$concept_integrated_mega$§!$NEW_LINE$- Research £physics£ §H$concept_integrated_precursor_mega$§!$NEW_LINE$- Build ['starbase_building:voidark_precursor_dynamic_system', $sm_voidark_precursor_dynamic_system$]$NEW_LINE$- Research any ['concept_integrated_precursor_mega']$NEW_LINE$$NEW_LINE$The effect will then activate on the §H$sm_voidark_precursor_dynamic_system$§!"

