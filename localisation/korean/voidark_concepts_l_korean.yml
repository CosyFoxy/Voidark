  concept_delta_tier: "§EDelta§!"
  concept_delta_tier_desc: "£icon_delta_core£ Delta technologies will require very minimal £acot_sr_dark_energy£ ['concept_dark_energy'] usage, allowing most empires to reliably utilize most of the techs without much difficulty. However, they are relatively expensive in £sr_dark_matter£ ['concept_dark_matter']. "
  concept_alpha_tier: "§BAlpha§!"
  concept_alpha_tier_desc: "£icon_alpha_core£ Alpha technologies will require much higher £acot_sr_dark_energy£ ['concept_dark_energy'], but less £sr_dark_matter£ ['concept_dark_matter'], and are 1.3 times more powerful than £icon_delta_core£ ['concept_delta_tier'] technologies. "
  concept_phi_tier: "§CPhi§!"
  concept_phi_tier_desc: "£icon_phi_core£ §H$concept_phi_tier$§! technologies can be thought of as a direct upgrade of £icon_alpha_core£ ['concept_alpha_tier'] technologies, being 1.3 times more powerful. They are obtained by reverse-engineering the wreckages of Phanon ships, or as a preliminary measure before invading the vault. Progressing through the Rival Path will also grant you this technology."
  concept_phanon_tier: "§RRunic§!"
  concept_phanon_tier_desc: "The more powerful tier of the £icon_phanon_core£ §H$concept_phanon_tier$§!, it can be obtained from discovering the secrets behind the Phanon Corps in their vault. They are 1.4 times more powerful than £icon_phi_core£ ['concept_phi_tier'], and can be considered an alternative to £icon_stellarite_core£ ['concept_stellarite_tier'] that eats more alloys than £strategic_resource£ ['concept_strategic_resources']."
  concept_stellarite_tier: "§HStellarite§!"
  concept_stellarite_tier_desc: "Currently the only tier of the Stellar Technologies, £icon_stellarite_core£ §HSigma§! utilizes the power of the stars to smite and purge the oppositions, and is 1.5 times more powerful than £icon_phi_core£ ['concept_phi_tier']."

