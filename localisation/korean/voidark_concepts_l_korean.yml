  voidark_doc_beta_test_10: "$NEW_LINE$$NEW_LINE$§YNOTE:§! Until ACOT adds specific modules & components, you will not get any specific ACOT style modules.$NEW_LINE$$NEW_LINE$§YNOTE:§! Until ACOT adds a way for nomads to reach §H$concept_phanon_tier$§! §RTier§!, §H$concept_phanon_tier$§! and §H$concept_stellarite_tier$§! Districts and Zones can only be accessed by getting £research£ ['technology:tech_dark_matter_power_core_re', $tech_dark_matter_power_core_re$] via console, or by using the console command §cevent voidark_test.1§!"
