  #DOCUMENTATION---------------------------------------------------------------
  
  voidark_docs_chain_title:99 "Voidark Documentation"
  voidark_docs_chain_desc:99 "$xhk_worldark_docs_chain_desc$"
  
  voidark_doc_basics_title:99 "1) Voidark"
  voidark_doc_basics_desc:99 "$voidark_doc_basics_1$$voidark_doc_basics_2$$voidark_doc_basics_3$$voidark_doc_basics_4$$voidark_doc_basics_5$$voidark_doc_basics_6$"
  voidark_doc_basics_1:99 "The §Y$xhk_pc_worldark$§! can be further upgraded to the tiers of ACOT. $NEW_LINE$$NEW_LINE$§YFirst, upgrade the $xhk_pc_worldark$ to §H$xhk_worldark_tier_12$§!, then to §E$xhk_worldark_tier_13$§!.$NEW_LINE$Swap £zone£ ['concept_district_specializations'] to access the new zones!§!$NEW_LINE$$NEW_LINE$Upgrades require researching a specific technology, and then function like any previous $xhk_pc_worldark$ upgrades:$NEW_LINE$"
  voidark_doc_basics_2:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_delta_core£ $concept_delta_tier$ §ETier:§! Unlocks delta tier zones for each district, as well as delta tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_delta', $tech_voidark_delta$]"
  voidark_doc_basics_3:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_alpha_core£ $concept_alpha_tier$ §BTier:§! Unlocks alpha tier zones for each district, as well as alpha tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_alpha', $tech_voidark_alpha$]"
  voidark_doc_basics_4:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phi_core£ $concept_phi_tier$ §CTier:§! Unlocks phi tier worldark upgrade as well as phi tier components. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_phi', $tech_voidark_phi$]"
  voidark_doc_basics_5:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phanon_core£ $concept_phanon_tier$ §RTier:§! Unlocks runic tier zones for each district, as well as runic tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_phanon', $tech_voidark_phanon$]"
  voidark_doc_basics_6:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_stellarite_core£ $concept_stellarite_tier$ §HTier:§! Unlocks sigma tier zones for each district, as well as sigma tier components and systems. $TABBED_NEW_LINE$§YRequires: §!£engineering£ ['technology:tech_voidark_stellarite', $tech_voidark_stellarite$]"
  
  voidark_doc_precursor_megas_title:99 "2) Precursor Integrated Megastructures"
  voidark_doc_precursor_megas_desc:99 "By researching £physics£ ['technology:tech_voidark_precursor_integrated_megas', $tech_voidark_precursor_integrated_megas$] you can improve the capabilities of your ['concept_integrated_mega', $concept_integrated_mega_plural$].$NEW_LINE$$NEW_LINE$The system makes use of triggered modifiers. To benefit from it, you need to:$NEW_LINE$- Build any §H$concept_integrated_mega$§!$NEW_LINE$- Research £physics£ §H$concept_integrated_precursor_mega$§!$NEW_LINE$- Build ['starbase_building:voidark_precursor_dynamic_system', $sm_voidark_precursor_dynamic_system$]$NEW_LINE$- Research any ['concept_integrated_precursor_mega']$NEW_LINE$$NEW_LINE$The effect will then activate on the §H$sm_voidark_precursor_dynamic_system$§!"
  
  voidark_doc_phanon_vault_title:99 "3) Phanon Vault & Droppoint Mechanics"
  voidark_doc_phanon_vault_desc:99 "$voidark_doc_phanon_vault_1$$voidark_doc_phanon_vault_2$$voidark_doc_phanon_vault_3$$voidark_doc_phanon_vault_4$$voidark_doc_phanon_vault_5$"
  voidark_doc_phanon_vault_1:99 "As Nomadic empire, the way you access Phanon mechanics is slightly altered. Overall, the process is relatively similar:"
  voidark_doc_phanon_vault_2:99 "$NEW_LINE$$TABBED_NEW_LINE$- Capture Droppoint.$TABBED_NEW_LINE$- Invade £planet£ §Y$pc_acot_pmc_vault$§!.$TABBED_NEW_LINE$- Use ['concept_decision']: §H$decision_acot_infiltrate_phanon_grid$§!.$TABBED_NEW_LINE$- Repeat until the end of the invasion chain."
  voidark_doc_phanon_vault_3:99 "$NEW_LINE$$NEW_LINE$$NEW_LINE$§KFor Voidark, these are the changes:§!$TABBED_NEW_LINE$$TABBED_NEW_LINE$- Once the Droppoint Starbase is defeated, you will gain control of the system.$TABBED_NEW_LINE$- You will own the £planet£ §Y$pc_acot_pmc_vault$§! despite playing a single-colony origin.$TABBED_NEW_LINE$- After completing the Phanon events, you will (~1 to 2 years) get the option to integrate the Vault."
  voidark_doc_phanon_vault_4:99 "$NEW_LINE$$NEW_LINE$§YNOTE:§! Undertaking the normal path will allow you to integrate the Vault and resource orbitals."
  voidark_doc_phanon_vault_5:99 "$NEW_LINE$$NEW_LINE$§YNOTE:§! When undertaking the Rival path, you will be able to integrate the Vault."
  
  voidark_doc_components_title:99 "4) Components & Modules"
  voidark_doc_components_desc:99 "There exist components for each tier, with starbase buildings for most tiers (except Phi tier). You begin by having access to generalized weapon modules.$NEW_LINE$To change this:$TABBED_NEW_LINE$$TABBED_NEW_LINE$- Find the §HVoidark Policies Category§!.$TABBED_NEW_LINE$- Change the Policy ['policy:voidark_weapon_modules', §H$policy_voidark_weapon_modules$§!].$NEW_LINE$$NEW_LINE$£anomaly£ Make sure to read the policies' tooltips to properly understand what option enables what. There is a 5 year cooldown."
  
  
  voidark_doc_beta_test:99 "4) Voidark Beta Test"
  voidark_doc_beta_test_desc:99 "$voidark_doc_beta_test_1$$voidark_doc_beta_test_2$$voidark_doc_beta_test_9$$voidark_doc_beta_test_11$$voidark_doc_beta_test_12$$voidark_doc_beta_test_13$$voidark_doc_beta_test_8$"
  voidark_doc_beta_test_1:99 "Current scope and available features of the mod:"
  voidark_doc_beta_test_2:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_delta_core£ §H$concept_delta_tier$§! §ETier:§! Districts & Zones"
  voidark_doc_beta_test_9:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_alpha_core£ §H$concept_alpha_tier$§! §BTier:§! Districts & Zones"
  voidark_doc_beta_test_11:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phi_core£ §H$concept_phi_tier$§! §CTier:§! Worldark Upgrade"
  voidark_doc_beta_test_12:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_phanon_core£ §H$concept_phanon_tier$§! §RTier:§! Districts, Zones & Megastructure Replacements"
  voidark_doc_beta_test_13:99 "$TABBED_NEW_LINE$$TABBED_NEW_LINE$- £icon_stellarite_core£ §H$concept_stellarite_tier$§! §HTier:§! Districts & Zones"
  voidark_doc_beta_test_8:99 "$NEW_LINE$$NEW_LINE$§YCurrent Issues:§!$TABBED_NEW_LINE$- None that I am aware of"
  voidark_doc_beta_test_10:99 "$NEW_LINE$$NEW_LINE$§YNOTE:§! Until ACOT adds specific modules & components, you will not get any specific ACOT style modules."
  voidark_doc_beta_test_99:99 "$NEW_LINE$$NEW_LINE$§YNOTE:§! Until ACOT adds a way for nomads to reach §H$concept_phanon_tier$§! §RTier§!, §H$concept_phanon_tier$§! and §H$concept_stellarite_tier$§! Districts and Zones can only be accessed by getting £research£ ['technology:tech_dark_matter_power_core_re', $tech_dark_matter_power_core_re$] via console, or by using the console command §cevent voidark_test.1§!"
  